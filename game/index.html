<!doctype html>
<!-- Solmar Bay — the only page the game needs. One full-screen canvas,
     one module script, no external requests: everything the game draws,
     plays or shows comes from the files under src/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solmar Bay — an original open-world crime game for the browser. Walk, steal cars, outrun the police, and run five story missions across a sun-soaked coastal city.">
<title>Solmar Bay — an open-world crime game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e2a4a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: an open-world crime game. Walk, steal cars, outrun the police, and run missions for Mara Solis."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
